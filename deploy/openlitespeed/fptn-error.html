<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="refresh" content="20" />
    <title>FlashPoint — Brief update</title>
    <style>
      :root {
        --fpn-rojo: #c41e3a;
        --fpn-navy: #001f3f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #111;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }
      .wrap {
        max-width: 28rem;
        text-align: center;
      }
      .kicker {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--fpn-rojo);
      }
      h1 {
        margin: 0.75rem 0 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.85rem;
        font-weight: 700;
        line-height: 1.15;
        color: var(--fpn-navy);
      }
      p {
        margin: 0.85rem 0 0;
        font-size: 0.9rem;
        line-height: 1.55;
        color: rgba(0, 0, 0, 0.65);
      }
      .actions {
        margin-top: 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      a,
      button {
        font: inherit;
        font-size: 0.875rem;
        font-weight: 700;
        cursor: pointer;
        border-radius: 0.375rem;
        padding: 0.65rem 1.25rem;
        text-decoration: none;
      }
      .primary {
        border: none;
        background: var(--fpn-rojo);
        color: #fff;
      }
      .secondary {
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: #fff;
        color: #111;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="kicker">FlashPoint TV Network</p>
      <h1>We&rsquo;re updating the site</h1>
      <p>
        A new version is being deployed. This usually takes one to three minutes.
        The page will refresh automatically, or you can try again below.
      </p>
      <div class="actions">
        <button type="button" class="primary" onclick="location.reload()">
          Try again
        </button>
        <a class="secondary" href="https://fptn.com/">Home</a>
      </div>
      <p class="hint">If this lasts more than 5 minutes, contact your administrator.</p>
    </main>
  </body>
</html>
